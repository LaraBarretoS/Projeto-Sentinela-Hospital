<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recepção - Atendimento</title>
  <link rel="stylesheet" href="/css/atendimento.css">
</head>
<body>

<div class="container">
  <h2>Recepção - Novo Atendimento</h2>

  <!-- Nome Completo -->
  <div class="form-group">
    <input id="nome" placeholder="Nome Completo *">
  </div>

  <!-- CPF e Data de Nascimento -->
  <div class="form-group form-row">
    <input id="cpf" placeholder="CPF (000.000.000-00)">
    <input
      type="date"
      id="dataNascimento"
      onchange="calcularIdade()"
      title="Data de Nascimento"
    >
  </div>

  <!-- Sexo e Estado Civil -->
  <div class="form-group form-row">
    <select id="sexo">
      <option value="">Selecione o Sexo</option>
      <option value="Masculino">Masculino</option>
      <option value="Feminino">Feminino</option>
      <option value="Outro">Outro</option>
      <option value="NaoInformado">Prefiro não informar</option>
    </select>

    <select id="estadoCivil">
      <option value="">Selecione o Estado Civil</option>
      <option value="Solteiro(a)">Solteiro(a)</option>
      <option value="Casado(a)">Casado(a)</option>
      <option value="Divorciado(a)">Divorciado(a)</option>
      <option value="Viuvo(a)">Viúvo(a)</option>
      <option value="UniaoEstavel">União Estável</option>
    </select>
  </div>

  <!-- Campo para menores de idade -->
  <div class="menor-container" id="campoResponsavel">
    <label style="font-size: 12px; color: #856404; display: block; margin-bottom: 4px;">
      Paciente menor de idade:
    </label>

    <input
      id="responsavel"
      placeholder="Nome do Responsável *"
    >
  </div>

  <!-- Tipo de Atendimento -->
  <div class="form-group">
    <select id="tipo">
      <option value="Convenio">Convênio</option>
      <option value="Particular">Particular</option>
      <option value="SUS">SUS</option>
    </select>
  </div>

  <!-- Foto do Paciente -->
  <div class="form-group">
    <input type="file" id="foto">
  </div>

  <!-- Atendimento normal -->
  <button id="btnCadastrar" onclick="cadastrar()">
    Enviar para Triagem
  </button>

  <!-- Paciente em branco / emergência -->
  <button
    id="btnPacienteEmergencia"
    onclick="cadastrarPacienteEmBranco()"
  >
    Paciente em Branco / Emergência
  </button>

  <!-- Mensagem de retorno -->
  <div id="mensagem-status"></div>
</div>

<script>

let idadeCalculada = null;


// ======================================================
// CALCULAR IDADE
// ======================================================

function calcularIdade() {

  const dataNascInput =
    document.getElementById("dataNascimento").value;

  const divResponsavel =
    document.getElementById("campoResponsavel");

  if (!dataNascInput) {

    divResponsavel.style.display = "none";

    idadeCalculada = null;

    return;
  }

  const dataNascimento =
    new Date(dataNascInput);

  const hoje =
    new Date();

  let idade =
    hoje.getFullYear() -
    dataNascimento.getFullYear();

  const mes =
    hoje.getMonth() -
    dataNascimento.getMonth();

  if (
    mes < 0 ||
    (
      mes === 0 &&
      hoje.getDate() < dataNascimento.getDate()
    )
  ) {
    idade--;
  }

  idadeCalculada = idade;


  // Menor de idade
  if (idade < 18) {

    divResponsavel.style.display = "block";

  } else {

    divResponsavel.style.display = "none";

    document.getElementById("responsavel").value = "";
  }
}


// ======================================================
// MENSAGEM
// ======================================================

function exibirMensagem(texto, tipo) {

  const divStatus =
    document.getElementById("mensagem-status");

  divStatus.textContent = texto;

  divStatus.className = tipo;

  divStatus.style.display = "block";
}


// ======================================================
// CADASTRO NORMAL
// ======================================================

async function cadastrar() {

  const nomeVal =
    document.getElementById("nome").value.trim();

  const dataNascVal =
    document.getElementById("dataNascimento").value;

  const responsavelVal =
    document.getElementById("responsavel").value.trim();

  const btn =
    document.getElementById("btnCadastrar");


  // Validação
  if (!nomeVal || !dataNascVal) {

    exibirMensagem(
      "Por favor, preencha o Nome e a Data de Nascimento.",
      "erro"
    );

    return;
  }


  // Validação de menor de idade
  if (
    idadeCalculada !== null &&
    idadeCalculada < 18 &&
    !responsavelVal
  ) {

    exibirMensagem(
      "Pacientes menores de idade precisam do nome do responsável.",
      "erro"
    );

    return;
  }


  btn.disabled = true;

  exibirMensagem(
    "Enviando dados...",
    "sucesso"
  );


  const dadosPaciente = {

    pacienteEmBranco: false,

    nome: nomeVal,

    cpf:
      document.getElementById("cpf").value.trim(),

    dataNascimento:
      dataNascVal,

    idade:
      idadeCalculada,

    sexo:
      document.getElementById("sexo").value,

    estadoCivil:
      document.getElementById("estadoCivil").value,

    responsavel:
      responsavelVal,

    tipo:
      document.getElementById("tipo").value
  };


  try {

    const resposta =
      await fetch("/atendimento", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body:
          JSON.stringify(dadosPaciente)
      });


    const resultado =
      await resposta.json();


    if (resposta.ok) {

      exibirMensagem(
        "Paciente cadastrado com sucesso e enviado para a Triagem!",
        "sucesso"
      );


      limparFormulario();

    } else {

      exibirMensagem(
        resultado.erro ||
        "Erro no servidor ao tentar cadastrar o paciente.",
        "erro"
      );
    }


  } catch (erro) {

    console.error(
      "Erro na requisição:",
      erro
    );

    exibirMensagem(
      "Não foi possível conectar ao servidor.",
      "erro"
    );

  } finally {

    btn.disabled = false;
  }
}


// ======================================================
// PACIENTE EM BRANCO / EMERGÊNCIA
// ======================================================

async function cadastrarPacienteEmBranco() {

  const btnEmergencia =
    document.getElementById(
      "btnPacienteEmergencia"
    );


  btnEmergencia.disabled = true;


  exibirMensagem(
    "Criando paciente de emergência...",
    "sucesso"
  );


  const dadosPaciente = {

    pacienteEmBranco: true,

    tipo: "SUS"
  };


  try {

    const resposta =
      await fetch("/atendimento", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body:
          JSON.stringify(dadosPaciente)
      });


    const resultado =
      await resposta.json();


    if (resposta.ok) {

      exibirMensagem(
        `${resultado.nome} criado e enviado para a Triagem!`,
        "sucesso"
      );

    } else {

      exibirMensagem(
        resultado.erro ||
        "Erro ao criar paciente de emergência.",
        "erro"
      );
    }


  } catch (erro) {

    console.error(
      "Erro na requisição:",
      erro
    );

    exibirMensagem(
      "Não foi possível conectar ao servidor.",
      "erro"
    );

  } finally {

    btnEmergencia.disabled = false;
  }
}


// ======================================================
// LIMPAR FORMULÁRIO
// ======================================================

function limparFormulario() {

  document.getElementById("nome").value = "";

  document.getElementById("cpf").value = "";

  document.getElementById("dataNascimento").value = "";

  document.getElementById("sexo").value = "";

  document.getElementById("estadoCivil").value = "";

  document.getElementById("responsavel").value = "";

  document.getElementById("campoResponsavel").style.display = "none";

  document.getElementById("foto").value = "";

  idadeCalculada = null;
}

</script>

</body>
</html>
