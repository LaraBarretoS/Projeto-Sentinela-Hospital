<section aria-labelledby="titulo-dados" class="ref-card ref-registration patient-registration"><h3 class="ref-section-heading" id="titulo-dados">Dados do paciente</h3><div class="ref-form-grid"><div class="form-group ref-full"><label for="nome">Nome completo *</label>
<input id="nome" placeholder="Digite o nome completo do paciente"/>
</div><div class="form-group form-row ref-pair">
<div class="ref-field"><label for="cpf">CPF</label><input id="cpf" placeholder="Digite o CPF"/></div>
<div class="ref-field"><label for="dataNascimento">Data de nascimento</label><input id="dataNascimento" onchange="calcularIdade()" title="Data de Nascimento" type="date"/></div>
</div><div class="form-group form-row ref-pair">

<option value="">Selecione o Sexo</option>
<option value="Masculino">Masculino</option>
<option value="Feminino">Feminino</option>

</select></div>
<div class="ref-field"><label for="estadoCivil">Estado civil</label><select id="estadoCivil">
<option value="">Selecione o Estado Civil</option>
<option value="Solteiro(a)">Solteiro(a)</option>

<option value="Divorciado(a)">Divorciado(a)</option>
<option value="Viuvo(a)">Viúvo(a)</option>

</select></div>

<option value="Convenio">Convênio</option>

</select>

<input id="foto" type="file"/>
</div></div><div class="ref-action-row patient-routing"><button class="ref-primary-action" id="btnCadastrar" onclick="cadastrar()">➤  Enviar para Triagem</button><button class="ref-danger-action" id="btnPacienteEmergencia" onclick="cadastrarPacienteEmBranco()">♧  Paciente em Branco / Emergência</button></div><div id="mensagem-status"></div></section></main>
<script>

let idadeCalculada = null;


// ======================================================
// CALCULAR IDADE
// ======================================================

function calcularIdade() {

  const dataNascInput =
    document.getElementById("dataNascimento").value;

  const divResponsavel =
    document.getElementById("campoResponsavel");

  if (!dataNascInput) {

    divResponsavel.style.display = "none";

    idadeCalculada = null;

    return;
  }

  const dataNascimento =
    new Date(dataNascInput);

  const hoje =
    new Date();

  let idade =
    hoje.getFullYear() -
    dataNascimento.getFullYear();

  const mes =
    hoje.getMonth() -
    dataNascimento.getMonth();

  if (
    mes < 0 ||
    (
      mes === 0 &&
      hoje.getDate() < dataNascimento.getDate()
    )
  ) {
    idade--;
  }

  idadeCalculada = idade;


  // Menor de idade
  if (idade < 18) {

    divResponsavel.style.display = "block";

  } else {

    divResponsavel.style.display = "none";

    document.getElementById("responsavel").value = "";
  }
}


// ======================================================
// MENSAGEM
// ======================================================

function exibirMensagem(texto, tipo) {

  const divStatus =
    document.getElementById("mensagem-status");

  divStatus.textContent = texto;

  divStatus.className = tipo;

  divStatus.style.display = "block";
}


// ======================================================
// CADASTRO NORMAL
// ======================================================

async function cadastrar() {

  const nomeVal =
    document.getElementById("nome").value.trim();

  const dataNascVal =
    document.getElementById("dataNascimento").value;

  const responsavelVal =
    document.getElementById("responsavel").value.trim();

  const btn =
    document.getElementById("btnCadastrar");


  // Validação
  if (!nomeVal || !dataNascVal) {

    exibirMensagem(
      "Por favor, preencha o Nome e a Data de Nascimento.",
      "erro"
    );

    return;
  }


  // Validação de menor de idade
  if (
    idadeCalculada !== null &&
    idadeCalculada < 18 &&
    !responsavelVal
  ) {

    exibirMensagem(
      "Pacientes menores de idade precisam do nome do responsável.",
      "erro"
    );

    return;
  }


  btn.disabled = true;

  exibirMensagem(
    "Enviando dados...",
    "sucesso"
  );


  const dadosPaciente = {

    pacienteEmBranco: false,

    nome: nomeVal,

    cpf:
      document.getElementById("cpf").value.trim(),

    dataNascimento:
      dataNascVal,

    idade:
      idadeCalculada,

    sexo:
      document.getElementById("sexo").value,

    estadoCivil:
      document.getElementById("estadoCivil").value,

    responsavel:
      responsavelVal,

    tipo:
      document.getElementById("tipo").value
  };


  try {

    const resposta =
      await fetch("/atendimento", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body:
          JSON.stringify(dadosPaciente)
      });


    const resultado =
      await resposta.json();


    if (resposta.ok) {

      exibirMensagem(
        "Paciente cadastrado com sucesso e enviado para a Triagem!",
        "sucesso"
      );


      limparFormulario();

    } else {

      exibirMensagem(
        resultado.erro ||
        "Erro no servidor ao tentar cadastrar o paciente.",
        "erro"
      );
    }


  } catch (erro) {

    console.error(
      "Erro na requisição:",
      erro
    );

    exibirMensagem(
      "Não foi possível conectar ao servidor.",
      "erro"
    );

  } finally {

    btn.disabled = false;
  }
}


// ======================================================
// PACIENTE EM BRANCO / EMERGÊNCIA
// ======================================================

async function cadastrarPacienteEmBranco() {

  const btnEmergencia =
    document.getElementById(
      "btnPacienteEmergencia"
    );


  btnEmergencia.disabled = true;


  exibirMensagem(
    "Criando paciente de emergência...",
    "sucesso"
  );


  const dadosPaciente = {

    pacienteEmBranco: true,

    tipo: "SUS"
  };


  try {

    const resposta =
      await fetch("/atendimento", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body:
          JSON.stringify(dadosPaciente)
      });


    const resultado =
      await resposta.json();


    if (resposta.ok) {

      exibirMensagem(
        `${resultado.nome} criado e enviado para a Triagem!`,
        "sucesso"
      );

    } else {

      exibirMensagem(
        resultado.erro ||
        "Erro ao criar paciente de emergência.",
        "erro"
      );
    }


  } catch (erro) {

    console.error(
      "Erro na requisição:",
      erro
    );

    exibirMensagem(
      "Não foi possível conectar ao servidor.",
      "erro"
    );

  } finally {

    btnEmergencia.disabled = false;
  }
}


// ======================================================
// LIMPAR FORMULÁRIO
// ======================================================

function limparFormulario() {

  document.getElementById("nome").value = "";

  document.getElementById("cpf").value = "";

  document.getElementById("dataNascimento").value = "";

  document.getElementById("sexo").value = "";

  document.getElementById("estadoCivil").value = "";

  document.getElementById("responsavel").value = "";

  document.getElementById("campoResponsavel").style.display = "none";

  document.getElementById("foto").value = "";

  idadeCalculada = null;
}

</script>
