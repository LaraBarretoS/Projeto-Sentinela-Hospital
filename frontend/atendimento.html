<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/css/atendimento.css">
  <style>
    .form-group { margin-bottom: 10px; }
    .form-row { display: flex; gap: 10px; }
    .form-row input, .form-row select { flex: 1; }
    .menor-container {
      display: none;
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    #mensagem-status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
      font-weight: bold;
      text-align: center;
    }
    .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
<div class="container">
  <h2>Recepção - Novo Atendimento</h2>

  <div class="form-group">
    <input id="nome" placeholder="Nome Completo *">
  </div>

  <div class="form-group form-row">
    <input id="cpf" placeholder="CPF (000.000.000-00)">
    <input type="date" id="dataNascimento" onchange="calcularIdade()" title="Data de Nascimento">
  </div>

  <div class="form-group form-row">
    <select id="sexo">
      <option value="">Selecione o Sexo</option>
      <option value="Masculino">Masculino</option>
      <option value="Feminino">Feminino</option>
      <option value="Outro">Outro</option>
      <option value="NaoInformado">Prefiro não informar</option>
    </select>

    <select id="estadoCivil">
      <option value="">Selecione o Estado Civil</option>
      <option value="Solteiro(a)">Solteiro(a)</option>
      <option value="Casado(a)">Casado(a)</option>
      <option value="Divorciado(a)">Divorciado(a)</option>
      <option value="Viuvo(a)">Viúvo(a)</option>
      <option value="UniaoEstavel">União Estável</option>
    </select>
  </div>

  <div class="menor-container" id="campoResponsavel">
    <label style="font-size: 12px; color: #856404; display: block; margin-bottom: 4px;">Paciente menor de idade:</label>
    <input id="responsavel" placeholder="Nome do Responsável *">
  </div>

  <div class="form-group">
    <select id="tipo">
      <option value="Convenio">Convênio</option>
      <option value="Particular">Particular</option>
      <option value="SUS">SUS</option>
    </select>
  </div>

  <div class="form-group">
    <input type="file" id="foto">
  </div>

  <button id="btnCadastrar" onclick="cadastrar()">Enviar para Triagem</button>

  <!-- Div para exibir as mensagens na tela sem depender só do alert -->
  <div id="mensagem-status"></div>
</div>

<script>
let idadeCalculada = null;

function calcularIdade() {
  const dataNascInput = document.getElementById("dataNascimento").value;
  const divResponsavel = document.getElementById("campoResponsavel");

  if (!dataNascInput) {
    divResponsavel.style.display = "none";
    idadeCalculada = null;
    return;
  }

  const dataNascimento = new Date(dataNascInput);
  const hoje = new Date();
  let idade = hoje.getFullYear() - dataNascimento.getFullYear();
  const mes = hoje.getMonth() - dataNascimento.getMonth();

  if (mes < 0 || (mes === 0 && hoje.getDate() < dataNascimento.getDate())) {
    idade--;
  }

  idadeCalculada = idade;

  if (idade < 18) {
    divResponsavel.style.display = "block";
  } else {
    divResponsavel.style.display = "none";
    document.getElementById("responsavel").value = "";
  }
}

function exibirMensagem(texto, tipo) {
  const divStatus = document.getElementById("mensagem-status");
  divStatus.textContent = texto;
  divStatus.className = tipo; // 'sucesso' ou 'erro'
  divStatus.style.display = "block";
}

async function cadastrar(){
  const nomeVal = document.getElementById("nome").value.trim();
  const dataNascVal = document.getElementById("dataNascimento").value;
  const responsavelVal = document.getElementById("responsavel").value.trim();
  const btn = document.getElementById("btnCadastrar");

  // Validação basica
  if(!nomeVal || !dataNascVal) {
    exibirMensagem("Por favor, preencha o Nome Completo e a Data de Nascimento.", "erro");
    return;
  }

  if(idadeCalculada !== null && idadeCalculada < 18 && !responsavelVal) {
    exibirMensagem("Pacientes menores de idade precisam do nome do responsável.", "erro");
    return;
  }

  // Trava o botão para evitar múltiplos cliques
  btn.disabled = true;
  exibirMensagem("Enviando dados...", "sucesso");

  // Estrutura de dados pronta para a fila da Triagem
  const novoAtendimento = {
    nome: nomeVal,
    cpf: document.getElementById("cpf").value.trim(),
    dataNascimento: dataNascVal,
    idade: idadeCalculada,
    sexo: document.getElementById("sexo").value,
    estadoCivil: document.getElementById("estadoCivil").value,
    responsavel: responsavelVal,
    tipo: document.getElementById("tipo").value,
    status: "Aguardando Triagem", // Define a etapa inicial do paciente
    dataHoraEntrada: new Date().toISOString()
  };

  try {
    const resposta = await fetch("http://localhost:3000/atendimento", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(novoAtendimento)
    });

    if (resposta.ok) {
      exibirMensagem("Paciente cadastrado com sucesso e enviado para a fila de Triagem!", "sucesso");
      
      // Limpa os campos após salvar
      document.getElementById("nome").value = "";
      document.getElementById("cpf").value = "";
      document.getElementById("dataNascimento").value = "";
      document.getElementById("sexo").value = "";
      document.getElementById("estadoCivil").value = "";
      document.getElementById("responsavel").value = "";
      document.getElementById("campoResponsavel").style.display = "none";
      document.getElementById("foto").value = "";
    } else {
      exibirMensagem("Erro no servidor ao tentar cadastrar o paciente.", "erro");
    }
  } catch (erro) {
    console.error("Erro na requisição:", erro);
    exibirMensagem("Não foi possível conectar ao servidor (localhost:3000). Verifique se a API está rodando.", "erro");
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
