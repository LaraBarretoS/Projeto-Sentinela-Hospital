<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <link rel="icon" type="image/svg+xml" href="/assets/sentinela-icon.svg"/>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>Painel de chamadas • Hospital Sentinela</title>
 <link rel="stylesheet" href="/css/tv.css"/>
</head>
<body class="tv-display">
 <main class="tv-container" aria-label="Painel de chamadas do Hospital Sentinela">
  <aside class="left-panel">
   <section class="box local-box" aria-label="Local de atendimento">
    <div class="tv-heading"><span class="tv-people-icon" aria-hidden="true">●●●</span><span id="local-tipo">Guichê</span></div>
    <div class="local-number" id="local-numero">--</div>
   </section>
   <section class="box history-box" aria-label="Últimas chamadas">
    <h2 class="tv-heading"><span class="tv-history-icon" aria-hidden="true">◴</span> Últimas chamadas</h2>
    <ul id="history-list" aria-live="polite"></ul>
   </section>
  </aside>
  <div class="right-panel">
   <section class="box patient-box" aria-label="Chamada atual">
    <div class="patient-name" id="patient-name" aria-live="polite" aria-atomic="true">Aguardando...</div>
    <div class="tv-call-instruction">Dirija-se ao <strong id="local-indicacao">local indicado</strong></div>
   </section>
   <footer class="box logo-box">
    <div class="logo-text"><span class="tv-cross" aria-hidden="true">✚</span><span>Hospital<br/><strong>Sentinela</strong></span></div>
    <span class="tv-footer-tag">PAINEL DE CHAMADAS</span>
   </footer>
  </div>
 </main>
 <div id="conteudoMultimidia" aria-live="polite" aria-label="Comunicado do hospital">
  <div class="tv-message"><div class="tv-message-icon" aria-hidden="true">✚</div><h1 id="conteudoTitulo"></h1><p id="conteudoTexto"></p></div>
 </div>
 <script>
 let ultimoId = null;
 function atualizar() {
  fetch('/tv/chamada')
   .then(r => {if (!r.ok) throw new Error('Falha na consulta da TV');return r.json()})
   .then(data => {
    const chamada=data.chamada;
    const historico=Array.isArray(data.historico)?data.historico:[];
    if (chamada) {
     const tipo=String(chamada.localTipo || 'GUICHÊ');
     const numero=String(chamada.localNumero ?? '--');
     document.getElementById('local-tipo').textContent=tipo;
     document.getElementById('local-numero').textContent=numero;
     document.getElementById('patient-name').textContent=chamada.paciente || 'AGUARDANDO...';
     document.getElementById('local-indicacao').textContent=`${tipo} ${numero}`;
     if (chamada.id !== ultimoId) {
      ultimoId=chamada.id;
      const box=document.querySelector('.patient-box');
      box.classList.remove('flash');void box.offsetWidth;box.classList.add('flash');
     }
    }
    const list=document.getElementById('history-list');list.replaceChildren();
    historico.slice(0,3).forEach(h => {
     const li=document.createElement('li');
     const paciente=document.createElement('strong');paciente.textContent=h.paciente || 'Paciente';
     const local=document.createElement('span');local.textContent=`${h.localTipo || 'Guichê'} ${h.localNumero ?? '--'}`;
     li.append(paciente,local);list.appendChild(li);
    });
   })
   .catch(err => console.warn('Erro ao buscar chamada:',err));
 }
 atualizar();setInterval(atualizar,2000);
 let conteudosTV=[];let indiceTV=0;let hideMensagem=null;
 async function carregarConteudosTV(){try{const res=await fetch('/tv/conteudo');if(res.ok){const data=await res.json();conteudosTV=Array.isArray(data)?data:[]}}catch(e){console.warn('Comunicados indisponíveis',e)}}
 function mostrarConteudoTV(){
  if(!conteudosTV.length)return;
  const box=document.getElementById('conteudoMultimidia');
  document.getElementById('conteudoTitulo').textContent=conteudosTV[indiceTV]?.titulo || '';
  document.getElementById('conteudoTexto').textContent=conteudosTV[indiceTV]?.texto || '';
  indiceTV=(indiceTV+1)%conteudosTV.length;
  box.style.display='flex';
  if(hideMensagem)clearTimeout(hideMensagem);
  hideMensagem=setTimeout(()=>box.style.display='none',6500);
 }
 carregarConteudosTV();
 setInterval(()=>{if(ultimoId===null)mostrarConteudoTV()},9000);
 </script>
</body>
</html>
