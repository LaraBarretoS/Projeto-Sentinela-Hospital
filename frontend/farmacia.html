<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmácia - Hospital Sentinela</title><link rel="stylesheet" href="/theme.css"><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#1a202c}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:12px;margin:12px 0;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}input,select{padding:10px;border:1px solid #cbd5e1;border-radius:7px;width:100%;box-sizing:border-box}.btn{padding:10px 13px;border:0;border-radius:7px;background:#2b6cb0;color:white;cursor:pointer}.baixo{color:#c53030;font-weight:700}.ok{color:#2f855a;font-weight:700}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}</style></head><body><div class="wrap"><h1>💊 Farmácia</h1><p>Controle de estoque, dispensação e movimentações.</p><div class="card"><h2>Estoque</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Medicamento</th><th>Quantidade</th><th>Mínimo</th><th>Status</th></tr></thead><tbody id="estoque"></tbody></table></div></div><div class="card"><h2>📦 Movimentar estoque</h2><div class="grid"><div><label>Medicamento</label><select id="med"></select></div><div><label>Quantidade</label><input id="qtd" type="number" min="1" value="1"></div><div><label>Paciente (saída)</label><input id="paciente" placeholder="Opcional"></div></div><p><button class="btn" onclick="mov('entrada')">➕ Entrada</button> <button class="btn" onclick="mov('saida')">➖ Saída/Dispensação</button></p></div><div class="card"><h2>🧾 Histórico de movimentação</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Medicamento</th><th>Qtd.</th><th>Paciente</th><th>Usuário</th></tr></thead><tbody id="hist"></tbody></table></div></div></div><script>let meds=[];async function carregar(){meds=await fetch('/farmacia/estoque').then(r=>r.json());document.getElementById('estoque').innerHTML=meds.map(m=>`<tr><td>${m.nome}</td><td>${m.quantidade} ${m.unidade}</td><td>${m.minimo}</td><td class="${m.quantidade<=m.minimo?'baixo':'ok'}">${m.quantidade<=m.minimo?'⚠️ Estoque baixo':'✓ Normal'}</td></tr>`).join('');document.getElementById('med').innerHTML=meds.map(m=>`<option value="${m.id}">${m.nome}</option>`).join('');const h=await fetch('/farmacia/movimentacoes').then(r=>r.json());document.getElementById('hist').innerHTML=h.map(x=>`<tr><td>${new Date(x.dataHora).toLocaleString('pt-BR')}</td><td>${x.tipo}</td><td>${x.medicamento}</td><td>${x.quantidade}</td><td>${x.paciente||'—'}</td><td>${x.usuario}</td></tr>`).join('')||'<tr><td colspan="6">Nenhuma movimentação.</td></tr>'}async function mov(tipo){const body={medicamentoId:document.getElementById('med').value,quantidade:Number(document.getElementById('qtd').value),paciente:document.getElementById('paciente').value,usuario:window.sentinelaUser?.usuario};const r=await fetch('/farmacia/'+tipo,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)return alert(d.erro);alert('Movimentação registrada.');carregar()}carregar();setInterval(carregar,10000);</script><script src="/js/session.js"></script></body></html>
