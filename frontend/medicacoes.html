<!-- IMPLEMENTADO: local onde a lista de medicações será exibida -->

<section class="ref-card ref-medicines"><h3 class="ref-section-heading">Medicações prescritas</h3><p><a href="/farmacia.html">→ Abrir módulo completo da Farmácia</a></p><div id="listaMedicacoes"></div></section></main>
<script>

// IMPLEMENTADO: busca as consultas salvas e mostra as medicações
function carregarMedicacoesPrescritas() {
  fetch("/medicacoes")
    .then(r => r.json())
    .then(data => {
      const div = document.getElementById("listaMedicacoes");

      div.innerHTML = "";

      if (data.length === 0) {
        div.innerHTML = "<p>Nenhuma medicação prescrita.</p>";
        return;
      }

      data.forEach(c => {
        div.innerHTML += `
          <div class="card">
            <h3>${c.paciente}</h3>

            <p>
              <b>Medicação:</b>
              ${c.medicacao}
            </p>

            <p>
              <b>Diagnóstico:</b>
              ${c.diagnostico}
            </p>

            <p>
              <b>Observações:</b>
              ${c.obs || "Nenhuma"}
            </p>
          </div>
        `;
      });
    });
}

carregarMedicacoesPrescritas();

</script>
<script src="/js/theme.js"></script>
