<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="/theme.css" rel="stylesheet"/>
<link href="/css/medicacoes.css" rel="stylesheet"/>
<link href="/design-overrides.css" rel="stylesheet"/>
<link href="/structural-layout.css" rel="stylesheet"/>
<link href="/reference-layout.css" rel="stylesheet"/><link href="/design-final-v4.css" rel="stylesheet"/></head>
<body>
<button class="theme-toggle" id="themeToggle" onclick="alternarTema()" type="button">🌙</button>
<main class="container sentinela-content sector-content reference-v3 design-v4" id="conteudo-principal"><section aria-label="Identificação do setor" class="ref-hero"><nav aria-label="Localização na aplicação" class="ref-breadcrumb"><a href="#conteudo-principal">⌂</a><span aria-hidden="true">›</span><span>Medicações</span></nav><div class="ref-hero-main"><div aria-hidden="true" class="ref-hero-emblem">✚</div><div class="ref-hero-copy"><h2>Prescrições registradas</h2><p>Consulte os registros de medicação e acesse o estoque da Farmácia.</p></div><div aria-hidden="true" class="ref-hero-art"><img alt="" loading="eager" src="/assets/hospital-ilustracao.png"/></div></div></section>
<!-- IMPLEMENTADO: local onde a lista de medicações será exibida -->
<section class="ref-card ref-medicines"><h3 class="ref-section-heading">Medicações prescritas</h3><p><a href="/farmacia.html">→ Abrir módulo completo da Farmácia</a></p><div id="listaMedicacoes"></div></section></main>
<script>

// IMPLEMENTADO: busca as consultas salvas e mostra as medicações
function carregarMedicacoesPrescritas() {
  fetch("/medicacoes")
    .then(r => r.json())
    .then(data => {
      const div = document.getElementById("listaMedicacoes");

      div.innerHTML = "";

      if (data.length === 0) {
        div.innerHTML = "<p>Nenhuma medicação prescrita.</p>";
        return;
      }

      data.forEach(c => {
        div.innerHTML += `
          <div class="card">
            <h3>${c.paciente}</h3>

            <p>
              <b>Medicação:</b>
              ${c.medicacao}
            </p>

            <p>
              <b>Diagnóstico:</b>
              ${c.diagnostico}
            </p>

            <p>
              <b>Observações:</b>
              ${c.obs || "Nenhuma"}
            </p>
          </div>
        `;
      });
    });
}

carregarMedicacoesPrescritas();

</script>
<script src="/js/theme.js"></script>
<script src="/js/session.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/reference-ui.js"></script></body>
</html>
