<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/css/medicacoes.css">
  <link rel="stylesheet" href="/theme.css">
</head>

<body>
<button id="themeToggle" class="theme-toggle" onclick="alternarTema()" type="button">🌙</button>

<div class="container">

  <h2>💊 Medicações Prescritas</h2><p><a href="/farmacia.html">→ Abrir módulo completo da Farmácia</a></p>

  <!-- IMPLEMENTADO: local onde a lista de medicações será exibida -->
  <div id="listaMedicacoes"></div>

</div>

<script>

// IMPLEMENTADO: busca as consultas salvas e mostra as medicações
function carregarMedicacoesPrescritas() {
  fetch("/medicacoes")
    .then(r => r.json())
    .then(data => {
      const div = document.getElementById("listaMedicacoes");

      div.innerHTML = "";

      if (data.length === 0) {
        div.innerHTML = "<p>Nenhuma medicação prescrita.</p>";
        return;
      }

      data.forEach(c => {
        div.innerHTML += `
          <div class="card">
            <h3>${c.paciente}</h3>

            <p>
              <b>Medicação:</b>
              ${c.medicacao}
            </p>

            <p>
              <b>Diagnóstico:</b>
              ${c.diagnostico}
            </p>

            <p>
              <b>Observações:</b>
              ${c.obs || "Nenhuma"}
            </p>
          </div>
        `;
      });
    });
}

carregarMedicacoesPrescritas();

</script>

<script src="/js/theme.js"></script>
<script src="/js/session.js"></script>
</body>
</html>
