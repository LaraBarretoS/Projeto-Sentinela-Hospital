<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prescrições | Hospital Sentinela</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/design.css"></head><body>
<main class="wrap"><section class="stock-panel"><h2>Prescrições registradas</h2><p>Registros das consultas concluídas no sistema.</p>
<div class="stock-table-scroll"><table class="table"><thead><tr><th>Paciente</th><th>Medicação</th><th>Diagnóstico</th><th>Observações</th></tr></thead><tbody id="listaMedicacoes"><tr><td colspan="4" class="empty-message">Carregando...</td></tr></tbody></table></div>
<p><a id="voltarSetor" href="/almoxarifado.html">Voltar ao setor</a></p></section></main>
<script>
const escapeHTML = v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function carregarMedicacoesPrescritas(){const list=document.getElementById('listaMedicacoes');try{const r=await fetch('/medicacoes');const data=await r.json();if(!r.ok||!Array.isArray(data))throw Error(data.erro||'Falha ao carregar prescrições.');
list.innerHTML=data.map(c=>`<tr><td>${escapeHTML(c.paciente)}</td><td>${escapeHTML(c.medicacao||'—')}</td><td>${escapeHTML(c.diagnostico||'—')}</td><td>${escapeHTML(c.obs||'—')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty-message">Nenhuma prescrição registrada.</td></tr>';
}catch(e){list.textContent=e.message}}
carregarMedicacoesPrescritas();
</script><script src="/js/session.js"></script><script src="/js/theme.js"></script><script src="/js/ui.js"></script>
<script>document.getElementById('voltarSetor').href=window.sentinelaUser?.tipo==='medico'?'/medico.html':'/almoxarifado.html';</script></body></html>
