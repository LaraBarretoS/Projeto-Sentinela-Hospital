<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="/theme.css" rel="stylesheet"/>
<link href="/css/medicacoes.css" rel="stylesheet"/>
<link href="/design-overrides.css" rel="stylesheet"/>
<link rel="stylesheet" href="/structural-layout.css">
</head>
<body>
<button class="theme-toggle" id="themeToggle" onclick="alternarTema()" type="button">🌙</button>
<main class="container sentinela-content sector-content" id="conteudo-principal">
<h2>💊 Medicações Prescritas</h2><p><a href="/farmacia.html">→ Abrir módulo completo da Farmácia</a></p>
<!-- IMPLEMENTADO: local onde a lista de medicações será exibida -->
<div id="listaMedicacoes"></div>
</main>
<script>

// IMPLEMENTADO: busca as consultas salvas e mostra as medicações
function carregarMedicacoesPrescritas() {
  fetch("/medicacoes")
    .then(r => r.json())
    .then(data => {
      const div = document.getElementById("listaMedicacoes");

      div.innerHTML = "";

      if (data.length === 0) {
        div.innerHTML = "<p>Nenhuma medicação prescrita.</p>";
        return;
      }

      data.forEach(c => {
        div.innerHTML += `
          <div class="card">
            <h3>${c.paciente}</h3>

            <p>
              <b>Medicação:</b>
              ${c.medicacao}
            </p>

            <p>
              <b>Diagnóstico:</b>
              ${c.diagnostico}
            </p>

            <p>
              <b>Observações:</b>
              ${c.obs || "Nenhuma"}
            </p>
          </div>
        `;
      });
    });
}

carregarMedicacoesPrescritas();

</script>
<script src="/js/theme.js"></script>
<script src="/js/session.js"></script>
<script src="/js/layout.js"></script>
</body>
</html>
