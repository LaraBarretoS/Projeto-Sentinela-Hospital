<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração - Hospital Sentinela</title><link rel="stylesheet" href="/theme.css"><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#1a202c}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:white;border-radius:12px;padding:18px;box-shadow:0 3px 14px #0001}.num{font-size:28px;font-weight:800;color:#2b6cb0}.section{margin-top:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.baixo{color:#c53030;font-weight:700}.btn{padding:9px 12px;border:0;border-radius:7px;cursor:pointer;background:#2b6cb0;color:#fff}</style></head><body><div class="wrap"><div class="section"><h1>🏥 Administração</h1><p>Dashboard do Hospital Sentinela</p></div><div id="cards" class="grid"></div><div class="section card"><h2>👥 Frequência de hoje</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Funcionário</th><th>Cargo</th><th>Entrada</th><th>Saída</th><th>Status</th></tr></thead><tbody id="freq"></tbody></table></div></div><div class="section card"><h2>🔎 Auditoria</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Data/hora</th><th>Usuário</th><th>Ação</th><th>Alvo</th></tr></thead><tbody id="audit"></tbody></table></div></div></div><script src="/js/admin.js"></script><script src="/js/session.js"></script></body></html>
