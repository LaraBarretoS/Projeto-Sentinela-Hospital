<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Painel Médico</title>
<link href="/theme.css" rel="stylesheet"/>
<link href="/css/medico.css" rel="stylesheet"/>
<link href="/design-overrides.css" rel="stylesheet"/>
<link rel="stylesheet" href="/structural-layout.css">
</head>
<body>
<button class="theme-toggle" id="themeToggle" onclick="alternarTema()" type="button">🌙</button>
<main class="container sentinela-content sector-content" id="conteudo-principal">
<div class="extracted-ccc5e8e6 sector-intro">
<h2 class="extracted-6447d4f7">🩺 Painel Médico</h2>
<button class="extracted-b0d6d29b" onclick="window.open('tv.html','_blank')">📺 Abrir Tela da TV</button>
</div>
<div class="consultorio-box">
<label for="consultorio-num"><strong>Meu Consultório:</strong></label>
<input id="consultorio-num" type="text" value="01"/>
<span class="extracted-3aa0d1aa">Número enviado para a TV ao chamar.</span>
</div>
<div aria-label="Fila de pacientes e ficha de atendimento" class="medico-grid">
<div aria-label="Fila de pacientes" class="coluna-fila">
<h3 class="extracted-26c08ab1">Fila de Espera</h3>
<div class="emergencia-card">
<strong>🚨 Paciente de Emergência</strong>
<p class="extracted-ce795241">Paciente sem cadastro prévio. Use para atendimento imediato/testes.</p>
<button onclick="selecionarPacienteEmergencia()" type="button">Selecionar Paciente de Emergência</button>
</div>
<div id="triagens"><p class="extracted-778528eb">Carregando...</p></div>
<button class="extracted-db383b1c" onclick="carregar()">🔄 Atualizar Fila</button>
</div>
<div aria-label="Ficha de atendimento" class="coluna-form">
<h3 class="extracted-02dd0a00">Atendimento Médico</h3>
<div class="alerta-alergia" id="alertaAlergia"></div>
<div class="extracted-c57d05b9" id="historicoPaciente"></div>
<div class="form-group">
<label>Paciente Selecionado *</label>
<input class="extracted-4fbc116c" id="paciente" placeholder="Selecione um paciente na lista" readonly=""/>
</div>
<div class="form-group">
<label>Diagnóstico / Hipótese Diagnóstica *</label>
<input id="diagnostico" placeholder="Informe o diagnóstico"/>
</div>
<div class="form-group sintomas-editor">
<label>Sintomas do paciente</label>
<div class="sintoma-add-grid">
<input id="novoSintoma" placeholder="Sintoma (ex.: cefaleia)"/>
<input id="intensidadeSintoma" max="10" min="0" placeholder="Intensidade 0–10" type="number"/>
<input id="duracaoSintoma" placeholder="Duração (ex.: 2 dias)"/>
<input id="frequenciaSintoma" placeholder="Frequência"/>
</div>
<input id="observacaoSintoma" placeholder="Observação específica (opcional)"/>
<button class="btn-adicionar-sintoma" onclick="adicionarSintoma()" type="button">＋ Adicionar sintoma</button>
<div aria-live="polite" class="lista-sintomas" id="listaSintomas"></div>
<small>Os registros antigos com um único sintoma continuam sendo exibidos normalmente.</small>
</div>
<div class="form-group">
<label>Prescrição / Medicação *</label>
<select id="medicacao">
<option value="">Selecione a medicação</option>
</select>
</div>
<div class="form-group">
<label>Observações / Recomendações Médicas</label>
<textarea id="obs" placeholder="Anotações da consulta ou recomendações de alta..." rows="4"></textarea>
</div>
<div class="botoes-acao">
<button class="btn-pdf" onclick="gerarPDFAlta()">📄 Gerar Alta (PDF)</button>
<button class="btn-salvar" onclick="salvar()">Finalizar Consulta</button>
</div>
</div>
</div>
</main>
<script>
"use strict";
let triagensCarregadas = [];
let pacienteSelecionado = null;
let carregandoFila = false;
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let sintomasConsulta = [];
function renderizarSintomas() {
  const box = $("listaSintomas");
  if (!box) return;
  box.innerHTML = sintomasConsulta.length ? sintomasConsulta.map((item,i) => `<div class="sintoma-item"><span><b>${escapeHTML(item.nome)}</b> · Intensidade: ${item.intensidade || "—"}/10 · Duração: ${escapeHTML(item.duracao || "—")} · Frequência: ${escapeHTML(item.frequencia || "—")}<small>${escapeHTML(item.observacao || "")}</small></span><button type="button" data-editar-sintoma="${i}" aria-label="Editar sintoma">Editar</button><button type="button" data-remover-sintoma="${i}" aria-label="Remover sintoma">Remover</button></div>`).join("") : "<p>Nenhum sintoma adicional registrado.</p>";
}
function adicionarSintoma() {
  const nome=$("novoSintoma").value.trim();
  if (!nome) return alert("Informe o sintoma antes de adicionar.");
  sintomasConsulta.push({nome, intensidade:$("intensidadeSintoma").value, duracao:$("duracaoSintoma").value.trim(), frequencia:$("frequenciaSintoma").value.trim(), observacao:$("observacaoSintoma").value.trim()});
  ["novoSintoma","intensidadeSintoma","duracaoSintoma","frequenciaSintoma","observacaoSintoma"].forEach(id=>$(id).value="");
  renderizarSintomas();
}
$("listaSintomas").addEventListener("click", event => {
  const edit = event.target.closest("button[data-editar-sintoma]");
  if (edit) {
    const index = Number(edit.dataset.editarSintoma);
    const item = sintomasConsulta[index];
    if (!item) return;
    const nome = prompt("Nome do sintoma:", item.nome);
    if (nome === null) return;
    const intensidade = prompt("Intensidade (0 a 10):", item.intensidade || "");
    if (intensidade === null) return;
    if (intensidade && !/^([0-9]|10)$/.test(intensidade)) return alert("Intensidade deve estar entre 0 e 10.");
    const duracao = prompt("Duração:", item.duracao || "");
    if (duracao === null) return;
    const frequencia = prompt("Frequência:", item.frequencia || "");
    if (frequencia === null) return;
    const observacao = prompt("Observações:", item.observacao || "");
    if (observacao === null) return;
    sintomasConsulta[index] = { nome: nome.trim(), intensidade, duracao: duracao.trim(), frequencia: frequencia.trim(), observacao: observacao.trim() };
    renderizarSintomas();
    return;
  }
  const button=event.target.closest("button[data-remover-sintoma]");
  if (!button) return;
  sintomasConsulta.splice(Number(button.dataset.removerSintoma),1); renderizarSintomas();
});

async function requisicaoJSON(url, options = {}) {
  const response = await fetch(url, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.erro || data.error || `Erro HTTP ${response.status}`);
  return data;
}

async function carregar() {
  if (carregandoFila) return;
  carregandoFila = true;
  const div = $("triagens");
  try {
    const data = await requisicaoJSON("/triagens");
    if (!Array.isArray(data)) throw new Error("Formato de fila inválido.");
    const peso = { vermelho: 1, amarelo: 2, verde: 3 };
    triagensCarregadas = data.filter(t => t.status === "aguardando_medico" || !t.status)
      .sort((a,b) => (peso[a.risco] || 4) - (peso[b.risco] || 4));
    div.replaceChildren();
    if (!triagensCarregadas.length) {
      div.innerHTML = '<p class="extracted-5b52d149">Nenhum paciente na fila de espera.</p>';
      return;
    }
    triagensCarregadas.forEach((t, index) => {
      const card = document.createElement("div");
      const selecionado = pacienteSelecionado && String(pacienteSelecionado.id ?? "") === String(t.id ?? "");
      const risco = ["vermelho", "amarelo", "verde"].includes(t.risco) ? t.risco : "verde";
      card.className = `card-paciente ${selecionado ? "selecionado" : ""}`;
      card.innerHTML = `<div class="extracted-1fadc7d7"><strong>${escapeHTML(t.nome || "Paciente sem nome")}</strong><span class="badge-risco ${risco}">${escapeHTML(risco)}</span></div>
        <p class="extracted-fa201034"><b>Sintoma:</b> ${escapeHTML(t.sintoma || "Não informado")}</p>
        <p class="extracted-fa201034"><b>Temp:</b> ${t.temperatura ? escapeHTML(t.temperatura) + "°C" : "—"} | <b>Alergia:</b> ${escapeHTML(t.alergia || "Nenhuma")}</p>
        <p class="extracted-fa201034"><b>PA:</b> ${escapeHTML(t.sinaisVitais?.pressao || "—")} · <b>FC:</b> ${escapeHTML(t.sinaisVitais?.frequenciaCardiaca || "—")} · <b>FR:</b> ${escapeHTML(t.sinaisVitais?.frequenciaRespiratoria || "—")} · <b>SpO₂:</b> ${escapeHTML(t.sinaisVitais?.spo2 || "—")}%</p>
        ${Array.isArray(t.sinaisAlerta) && t.sinaisAlerta.length ? `<p class="extracted-5977a114"><b>⚠ Alertas:</b> ${escapeHTML(t.sinaisAlerta.join(", "))}</p>` : ""}
        <div class="botoes-card"><button type="button" class="btn-tv" data-action="chamar" data-index="${index}">📺 Chamar na TV</button><button type="button" class="btn-atender" data-action="selecionar" data-index="${index}">Apenas Selecionar</button></div>`;
      div.appendChild(card);
    });
  } catch (error) {
    div.innerHTML = `<p role="alert" class="extracted-3c7371bb">Não foi possível carregar a fila. ${escapeHTML(error.message)}</p>`;
  } finally { carregandoFila = false; }
}

$("triagens").addEventListener("click", async event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const index = Number(button.dataset.index);
  const triagem = triagensCarregadas[index];
  if (!triagem) return;
  selecionar(index);
  if (button.dataset.action === "chamar") {
    button.disabled = true;
    try {
      await requisicaoJSON("/tv/chamar", { method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({localTipo:"CONSULTÓRIO", localNumero:$("consultorio-num").value.trim() || "01", paciente:triagem.nome || "Paciente sem nome"}) });
      alert("Paciente chamado na TV.");
    } catch (error) { alert(`Não foi possível chamar na TV: ${error.message}`); }
    finally { button.disabled = false; }
  }
});

function selecionarPacienteEmergencia() {
  pacienteSelecionado = { id:null, pacienteId:null, nome:"Paciente de Emergência", sintoma:"", temperatura:"", alergia:"" };
  $("paciente").value = pacienteSelecionado.nome;
  $("diagnostico").value = ""; $("medicacao").value = ""; $("obs").value = "";
  sintomasConsulta = []; renderizarSintomas();
  $("alertaAlergia").style.display = "none"; $("historicoPaciente").style.display = "none";
  carregar();
  requisicaoJSON("/tv/chamar", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({localTipo:"CONSULTÓRIO",localNumero:$("consultorio-num").value.trim() || "01",paciente:pacienteSelecionado.nome})})
    .catch(error => alert(`Paciente selecionado, mas não foi possível chamar na TV: ${error.message}`));
}

function selecionar(index) {
  const t = triagensCarregadas[index];
  if (!t) return;
  pacienteSelecionado = t;
  $("paciente").value = t.nome || "";
  $("diagnostico").value = ""; $("medicacao").value = "";
  sintomasConsulta = Array.isArray(t.sintomas) && t.sintomas.length ? t.sintomas.map(x => typeof x === "string" ? {nome:x} : x) : (t.sintoma ? [{nome:t.sintoma, origem:"triagem"}] : []);
  renderizarSintomas();
  $("obs").value = t.observacao ? `[Triagem]: ${t.observacao}\n` : "";
  const alergia = String(t.alergia || "").trim();
  const alerta = $("alertaAlergia");
  if (alergia && !["nenhuma", "não", "nao"].includes(alergia.toLocaleLowerCase("pt-BR"))) {
    alerta.style.display = "block"; alerta.innerHTML = `<strong>⚠️ ALERTA DE ALERGIA:</strong> ${escapeHTML(alergia)}`;
  } else { alerta.style.display = "none"; alerta.textContent = ""; }
  carregarHistoricoPaciente(t.pacienteId);
  carregar();
}

async function carregarHistoricoPaciente(pacienteId) {
  const box = $("historicoPaciente");
  if (!pacienteId) { box.style.display = "none"; box.textContent = ""; return; }
  try {
    const data = await requisicaoJSON(`/pacientes/${encodeURIComponent(pacienteId)}/historico`);
    const consultas = Array.isArray(data.consultas) ? data.consultas : [];
    box.style.display = "block";
    box.innerHTML = `<b>📋 Histórico do paciente</b><br><span class="extracted-a27ad5cf">${consultas.length ? consultas.map(c => `${c.createdAt && !Number.isNaN(new Date(c.createdAt).getTime()) ? new Date(c.createdAt).toLocaleDateString("pt-BR") : "Data não informada"} — ${escapeHTML(c.medicoNome || "Médico")} — ${escapeHTML(c.diagnostico || "Sem diagnóstico")} — ${escapeHTML(c.medicacao || "Sem medicação")}`).join("<br>") : "Nenhuma consulta anterior registrada."}</span>`;
  } catch (error) { box.style.display = "block"; box.textContent = "Não foi possível carregar o histórico deste paciente."; }
}

async function carregarMedicacoes() {
  const select = $("medicacao");
  try {
    const data = await requisicaoJSON("/farmacia/estoque");
    if (!Array.isArray(data)) throw new Error("Estoque inválido.");
    select.replaceChildren(new Option("Selecione a medicação", ""));
    data.filter(m => Number(m.quantidade) > 0).forEach(m => {
      const option = new Option(`${m.nome} (${m.quantidade} em estoque)${Number(m.quantidade) <= Number(m.minimo) ? " ⚠️ baixo" : ""}`, m.nome);
      select.add(option);
    });
    if (select.options.length === 1) select.add(new Option("Nenhuma medicação disponível", ""));
  } catch (error) { select.replaceChildren(new Option("Erro ao carregar medicações", "")); console.error("Erro ao carregar estoque:", error); }
}

async function gerarPDFAlta() {
  if (!pacienteSelecionado || !$("paciente").value.trim()) { alert("Selecione um paciente da fila ou o paciente de emergência."); return; }
  const dados = { paciente:$("paciente").value.trim(), sintoma:pacienteSelecionado.sintoma || "", temperatura:pacienteSelecionado.temperatura || "", alergia:pacienteSelecionado.alergia || "", diagnostico:$("diagnostico").value.trim(), medicacao:$("medicacao").value, obs:$("obs").value.trim() };
  try {
    const response = await fetch("/gerar-pdf-alta", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(dados)});
    if (!response.ok) { const erro = await response.json().catch(()=>({})); throw new Error(erro.erro || "Erro ao gerar PDF."); }
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = "alta-medica.pdf";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (error) { alert(`Não foi possível gerar o PDF: ${error.message}`); }
}

async function salvar() {
  if (!pacienteSelecionado || !$("paciente").value.trim()) { alert("Selecione um paciente antes de finalizar a consulta."); return; }
  const diagnostico = $("diagnostico").value.trim(), medicacao = $("medicacao").value;
  if (!diagnostico) { alert("Informe o diagnóstico."); $("diagnostico").focus(); return; }
  if (!medicacao) { alert("Selecione uma medicação."); $("medicacao").focus(); return; }
  const button = document.querySelector(".btn-salvar"); button.disabled = true;
  try {
    await requisicaoJSON("/consulta", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({triagemId:pacienteSelecionado.id ?? null,pacienteId:pacienteSelecionado.pacienteId ?? null,paciente:$("paciente").value.trim(),diagnostico,medicacao,obs:$("obs").value.trim(),medicoUsuario:window.sentinelaUser?.usuario,medicoNome:window.sentinelaUser?.nome,sintomas:sintomasConsulta})});
    alert("Consulta finalizada com sucesso!"); pacienteSelecionado = null;
    $("paciente").value = ""; $("diagnostico").value = ""; $("medicacao").value = ""; $("obs").value = "";
    sintomasConsulta = []; renderizarSintomas();
    $("alertaAlergia").style.display = "none"; $("historicoPaciente").style.display = "none";
    await carregar(); await carregarMedicacoes();
  } catch (error) { alert(`Não foi possível finalizar a consulta: ${error.message}`); }
  finally { button.disabled = false; }
}

carregar();
carregarMedicacoes();
setInterval(carregar, 10000);
</script>
<script src="/js/session.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/layout.js"></script>
</body>
</html>
