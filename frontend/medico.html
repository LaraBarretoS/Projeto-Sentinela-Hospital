<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Médico</title>
<link rel="stylesheet" href="/css/medico.css">
</head>
<body>

<div class="container">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h2 style="margin:0; color:#1a365d;">🩺 Painel Médico</h2>
    <button onclick="window.open('tv.html','_blank')" style="background:#3182ce; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer;">📺 Abrir Tela da TV</button>
  </div>

  <div class="consultorio-box">
    <label for="consultorio-num"><strong>Meu Consultório:</strong></label>
    <input type="text" id="consultorio-num" value="01">
    <span style="color:#4a5568; font-size:13px;">Número enviado para a TV ao chamar.</span>
  </div>

  <div class="medico-grid">
    <div class="coluna-fila">
      <h3 style="margin-top:0; color:#2d3748;">Fila de Espera</h3>
      <div id="triagens"><p style="color:#888; text-align:center;">Carregando...</p></div>
      <button onclick="carregar()" style="margin-top:10px; width:100%; background:#6c757d; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer;">🔄 Atualizar Fila</button>
    </div>

    <div class="coluna-form">
      <h3 style="margin-top:0; color:#2d3748; margin-bottom:15px;">Atendimento Médico</h3>
      <div id="alertaAlergia" class="alerta-alergia"></div>

      <div class="form-group">
        <label>Paciente Selecionado *</label>
        <input id="paciente" placeholder="Selecione um paciente na lista" readonly style="background-color: #edf2f7; font-weight: bold;">
      </div>

      <div class="form-group">
        <label>Diagnóstico / Hipótese Diagnóstica *</label>
        <input id="diagnostico" placeholder="Informe o diagnóstico">
      </div>

      <div class="form-group">
        <label>Prescrição / Medicação *</label>
        <select id="medicacao">
          <option value="">Selecione a medicação</option>
        </select>
      </div>

      <div class="form-group">
        <label>Observações / Recomendações Médicas</label>
        <textarea id="obs" rows="4" placeholder="Anotações da consulta ou recomendações de alta..."></textarea>
      </div>

      <div class="botoes-acao">
        <button class="btn-pdf" onclick="gerarPDFAlta()">📄 Gerar Alta (PDF)</button>
        <button class="btn-salvar" onclick="salvar()">Finalizar Consulta</button>
      </div>
    </div>
  </div>
</div>

<script>
let triagensCarregadas = [];
let pacienteSelecionado = null;

function carregar() {
  fetch("/triagens")
    .then(r => r.json())
    .then(data => {
      const fila = data.filter(t => t.status === "aguardando_medico" || !t.status);
      fila.sort((a, b) => {
        const peso = { vermelho: 1, amarelo: 2, verde: 3 };
        return (peso[a.risco] || 4) - (peso[b.risco] || 4);
      });

      triagensCarregadas = fila;
      const div = document.getElementById("triagens");
      div.innerHTML = "";

      if (fila.length === 0) {
        div.innerHTML = "<p style='color:#888; text-align:center; padding:20px 0;'>Nenhum paciente na fila de espera.</p>";
        return;
      }

      fila.forEach((t, index) => {
        const ehSelecionado = pacienteSelecionado && pacienteSelecionado.id === t.id;
        const divCard = document.createElement("div");
        divCard.className = `card-paciente ${ehSelecionado ? 'selecionado' : ''}`;
        
        divCard.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <strong>${t.nome}</strong>
            <span class="badge-risco ${t.risco}">${t.risco || 'verde'}</span>
          </div>
          <p style="font-size:12px; margin:4px 0; color:#4a5568;"><b>Sintoma:</b> ${t.sintoma || "Não informado"}</p>
          <p style="font-size:12px; margin:4px 0; color:#4a5568;"><b>Temp:</b> ${t.temperatura || "—"}°C | <b>Alergia:</b> ${t.alergia || "Nenhuma"}</p>
          <div class="botoes-card">
            <button class="btn-tv" onclick="chamarESelecionar(${index})">📺 Chamar na TV</button>
            <button class="btn-atender" onclick="selecionar(${index})">Apenas Selecionar</button>
          </div>
        `;
        div.appendChild(divCard);
      });
    })
    .catch(err => console.error("Erro ao carregar fila:", err));
}

function chamarESelecionar(index) {
  selecionar(index);
  const t = triagensCarregadas[index];
  const consultorio = document.getElementById("consultorio-num").value || "01";

  fetch("/tv/chamar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ localTipo: "CONSULTÓRIO", localNumero: consultorio, paciente: t.nome })
  });
}

function selecionar(index) {
  const t = triagensCarregadas[index];
  pacienteSelecionado = t;
  document.getElementById("paciente").value = t.nome;
  document.getElementById("obs").value = t.observacao ? `[Triagem]: ${t.observacao}\n` : "";

  const divAlerta = document.getElementById("alertaAlergia");
  if (t.alergia && t.alergia.toLowerCase() !== "nenhuma" && t.alergia.toLowerCase() !== "não") {
    divAlerta.style.display = "block";
    divAlerta.innerHTML = "<strong>⚠️ ALERTA DE ALERGIA:</strong> " + t.alergia;
  } else {
    divAlerta.style.display = "none";
  }
  carregar();
}

function carregarMedicacoes() {
  fetch("/lista-medicacoes")
    .then(r => r.json())
    .then(data => {
      const select = document.getElementById("medicacao");
      select.innerHTML = `<option value="">Selecione a medicação</option>`;
      data.forEach(med => {
        const option = document.createElement("option");
        option.value = med;
        option.textContent = med;
        select.appendChild(option);
      });
    });
}

function gerarPDFAlta() {
  const paciente = document.getElementById("paciente").value;
  const diagnostico = document.getElementById("diagnostico").value;
  const medicacao = document.getElementById("medicacao").value;
  const obs = document.getElementById("obs").value;

  if (!paciente) {
    alert("Por favor, selecione um paciente da lista.");
    return;
  }

  const dadosAlta = {
    paciente,
    sintoma: pacienteSelecionado ? pacienteSelecionado.sintoma : "",
    temperatura: pacienteSelecionado ? pacienteSelecionado.temperatura : "",
    alergia: pacienteSelecionado ? pacienteSelecionado.alergia : "",
    diagnostico,
    medicacao,
    obs
  };

  fetch("/gerar-pdf-alta", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(dadosAlta)
  })
  .then(async response => {
    if (!response.ok) throw new Error("Erro no servidor ao gerar PDF");
    return response.blob();
  })
  .then(blob => {
    const fileUrl = URL.createObjectURL(blob);
    window.open(fileUrl, "_blank");
  })
  .catch(() => {
    // FALLBACK NATIVO: Se a geração no servidor falhar, gera via impressão HTML no navegador
    gerarPDFNativoNavegador(dadosAlta);
  });
}

function gerarPDFNativoNavegador(dados) {
  const win = window.open("", "_blank");
  win.document.write(`
    <html>
    <head>
      <title>Termo de Alta Médica</title>
      <style>
        body { font-family: Arial, sans-serif; padding: 30px; color: #2d3748; }
        .header { border-bottom: 2px solid #2b6cb0; padding-bottom: 10px; margin-bottom: 20px; }
        .title { text-align: center; font-size: 18px; font-weight: bold; color: #2b6cb0; margin-bottom: 20px; }
        .box { border: 1px solid #cbd5e1; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .signature { margin-top: 60px; text-align: center; border-top: 1px solid #4a5568; width: 250px; margin-left: auto; margin-right: auto; padding-top: 5px; }
      </style>
    </head>
    <body>
      <div class="header">
        <h2>HOSPITAL SENTINELA</h2>
        <p>Data: ${new Date().toLocaleDateString('pt-BR')}</p>
      </div>
      <div class="title">TERMO DE ALTA MÉDICA</div>
      <div class="box">
        <p><strong>Paciente:</strong> ${dados.paciente}</p>
        <p><strong>Sintoma:</strong> ${dados.sintoma || '—'}</p>
        <p><strong>Temperatura:</strong> ${dados.temperatura ? dados.temperatura + ' °C' : '—'}</p>
        <p><strong>Alergias:</strong> ${dados.alergia || 'Nenhuma'}</p>
      </div>
      <div class="box">
        <p><strong>Diagnóstico:</strong> ${dados.diagnostico || '—'}</p>
        <p><strong>Medicação:</strong> ${dados.medicacao || 'Nenhuma'}</p>
      </div>
      <div class="box">
        <p><strong>Observações:</strong> ${dados.obs || 'Paciente liberado.'}</p>
      </div>
      <div class="signature">Dr. Médico Responsável</div>
      <script>window.onload = function() { window.print(); };<\/script>
    </body>
    </html>
  `);
  win.document.close();
}

function salvar() {
  const paciente = document.getElementById("paciente").value;
  const diagnostico = document.getElementById("diagnostico").value;
  const medicacao = document.getElementById("medicacao").value;
  const obs = document.getElementById("obs").value;

  if (!paciente || !diagnostico || !medicacao) {
    alert("Preencha todos os campos obrigatórios.");
    return;
  }

  fetch("/consulta", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ 
      triagemId: pacienteSelecionado ? pacienteSelecionado.id : null,
      paciente, 
      diagnostico, 
      medicacao, 
      obs 
    })
  })
  .then(() => {
    alert("Consulta finalizada com sucesso!");
    document.getElementById("paciente").value = "";
    document.getElementById("diagnostico").value = "";
    document.getElementById("medicacao").value = "";
    document.getElementById("obs").value = "";
    document.getElementById("alertaAlergia").style.display = "none";
    pacienteSelecionado = null;
    carregar();
  });
}

carregar();
carregarMedicacoes();
setInterval(carregar, 10000);
</script>

</body>
</html>
